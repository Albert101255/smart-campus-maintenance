# ===================================================================
# Smart Campus Complaint & Maintenance Management System Configuration
# ===================================================================

server.port=8080
spring.application.name=smart-campus-maintenance

# -------------------------------------------------------------------
# Database Configuration
# Persistent H2 file-backed DB with MySQL compatibility mode for persistent complaint storage across reboots.
# To switch to MySQL 8 server: set spring.profiles.active=mysql
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/smart_campus_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.smartcampus.maintenance=INFO
logging.level.org.springframework.security=WARN
