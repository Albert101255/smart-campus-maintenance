<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Audit Logs — Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('audit')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">System Audit &amp; Activity Logs</h3>
                    <p class="text-muted mb-0">Security and administrative activity trail across the portal.</p>
                </div>
            </div>

            <!-- Table -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Entity</th>
                                    <th>Entity ID</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${auditLogs.content}">
                                    <td class="small text-muted" th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">Time</td>
                                    <td>
                                        <span th:if="${log.user != null}" class="fw-bold text-dark" th:text="${log.user.name + ' (' + log.user.role + ')'}">User</span>
                                        <span th:if="${log.user == null}" class="text-muted">SYSTEM</span>
                                    </td>
                                    <td><span class="badge bg-dark" th:text="${log.action}">ACTION</span></td>
                                    <td th:text="${log.entityName}">Entity</td>
                                    <td th:text="${log.entityId}">ID</td>
                                    <td class="small text-secondary" th:text="${log.details}">Details</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white py-3" th:if="${auditLogs.totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${auditLogs.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/audit(page=${auditLogs.number - 1})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, auditLogs.totalPages - 1)}" th:classappend="${i == auditLogs.number} ? 'active'">
                                <a class="page-link" th:href="@{/admin/audit(page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${auditLogs.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/audit(page=${auditLogs.number + 1})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
