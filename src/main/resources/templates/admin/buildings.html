<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buildings — Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('buildings')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Campus Buildings &amp; Blocks</h3>
                    <p class="text-muted mb-0">Manage campus physical structure registry.</p>
                </div>
                <div>
                    <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addBuildingModal">
                        <i class="fas fa-plus-circle me-1"></i> Add Building
                    </button>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Building Name</th>
                                    <th>Code</th>
                                    <th>Location / Area</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${buildings}">
                                    <td><strong class="text-dark" th:text="${b.name}">Main Block</strong></td>
                                    <td><span class="badge bg-light text-dark border fw-bold" th:text="${b.code}">MB</span></td>
                                    <td class="text-muted" th:text="${b.location}">Central Campus</td>
                                    <td>
                                        <span th:if="${b.active}" class="badge bg-success">ACTIVE</span>
                                        <span th:if="${!b.active}" class="badge bg-secondary">INACTIVE</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/buildings/{id}/toggle(id=${b.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" th:classappend="${b.active ? 'btn-outline-danger' : 'btn-outline-success'}">
                                                <span th:text="${b.active ? 'Deactivate' : 'Activate'}">Toggle</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="addBuildingModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/admin/buildings}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">Add New Building</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="bName" class="form-label small fw-semibold">Building Name</label>
                                <input type="text" name="name" id="bName" class="form-control" required placeholder="e.g. Research Innovation Hub">
                            </div>
                            <div class="mb-3">
                                <label for="bCode" class="form-label small fw-semibold">Building Code (Optional)</label>
                                <input type="text" name="code" id="bCode" class="form-control" placeholder="e.g. RIH">
                            </div>
                            <div class="mb-3">
                                <label for="bLoc" class="form-label small fw-semibold">Location / Area</label>
                                <input type="text" name="location" id="bLoc" class="form-control" placeholder="e.g. North Quadrangle">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Building</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
