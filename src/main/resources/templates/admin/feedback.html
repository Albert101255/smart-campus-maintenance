<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback — Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('feedback')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Student Satisfaction Ratings &amp; Feedback</h3>
                    <p class="text-muted mb-0">Ratings provided by students upon maintenance work completion.</p>
                </div>
                <div class="card border-primary p-3 bg-light d-flex flex-row align-items-center gap-3">
                    <div class="stat-icon-wrapper bg-warning text-dark fs-3" style="width:48px; height:48px;">
                        <i class="fas fa-star"></i>
                    </div>
                    <div>
                        <div class="stat-label">Average Satisfaction Rating</div>
                        <div class="stat-value text-primary fs-3" th:text="${avgRating + ' / 5.0'}">5.0 / 5.0</div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Complaint ID</th>
                                    <th>Student</th>
                                    <th>Rating</th>
                                    <th>Comments</th>
                                    <th>Submitted Date</th>
                                    <th class="text-end">View Issue</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="fb : ${feedbackPage.content}">
                                    <td><strong class="text-primary" th:text="${fb.complaint.complaintNumber}">CMP-2026-00001</strong></td>
                                    <td class="fw-semibold text-dark" th:text="${fb.student.name}">Alex Morgan</td>
                                    <td>
                                        <div class="text-warning">
                                            <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, fb.rating)}"></i>
                                        </div>
                                    </td>
                                    <td class="text-secondary" th:text="${fb.comments}">Great service</td>
                                    <td class="small text-muted" th:text="${#temporals.format(fb.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/complaints/{id}(id=${fb.complaint.id})}" class="btn btn-sm btn-light border"><i class="fas fa-eye me-1"></i>View</a>
                                    </td>
                                </tr>
                                <tr th:if="${feedbackPage.totalElements == 0}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        No student feedback records submitted yet.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
