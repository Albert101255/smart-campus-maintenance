<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students Directory — Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('students')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Registered Student Directory</h3>
                    <p class="text-muted mb-0">View registered student profiles and manage access permissions.</p>
                </div>
            </div>

            <!-- Search Card -->
            <div class="card border-0 shadow-sm rounded-3 mb-4">
                <div class="card-body p-3">
                    <form th:action="@{/admin/students}" method="get" class="row g-2">
                        <div class="col-md-9">
                            <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by student name, email, register number...">
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search me-1"></i> Search</button>
                            <a href="/admin/students" class="btn btn-outline-secondary"><i class="fas fa-undo"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Register No</th>
                                    <th>Student Name</th>
                                    <th>Email Address</th>
                                    <th>Department</th>
                                    <th>Phone Number</th>
                                    <th>Status</th>
                                    <th class="text-end">Account Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="student : ${studentsPage.content}">
                                    <td><strong class="text-primary" th:text="${student.registerNumber}">STU2026001</strong></td>
                                    <td class="fw-semibold text-dark" th:text="${student.name}">Alex Morgan</td>
                                    <td th:text="${student.email}">student@smartcampus.com</td>
                                    <td><span class="badge bg-light text-dark border" th:text="${student.department}">CSE</span></td>
                                    <td th:text="${student.phoneNumber}">+1 555-0111</td>
                                    <td>
                                        <span th:if="${student.enabled}" class="badge bg-success">ACTIVE</span>
                                        <span th:if="${!student.enabled}" class="badge bg-danger">DISABLED</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/users/{id}/toggle(id=${student.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" th:classappend="${student.enabled ? 'btn-outline-danger' : 'btn-outline-success'}">
                                                <i th:classappend="${student.enabled ? 'fa-user-slash' : 'fa-user-check'}" class="fas me-1"></i>
                                                <span th:text="${student.enabled ? 'Disable' : 'Enable'}">Toggle</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
