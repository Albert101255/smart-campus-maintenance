<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Smart Campus Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <div class="stat-icon-wrapper bg-primary text-white mx-auto mb-2" style="width:56px; height:56px;">
                    <i class="fas fa-tools fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-0">SmartCampus</h3>
                <small class="text-muted text-uppercase tracking-wider fw-semibold">Complaint &amp; Maintenance Portal</small>
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                <h5 class="fw-bold text-dark mb-3 text-center">Account Sign In</h5>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                    <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}">Success</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" required placeholder="name@smartcampus.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group password-input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" required placeholder="••••••••">
                            <button type="button" id="login-password-toggle" class="btn input-group-text bg-light border-start-0 text-muted password-eye-btn" aria-label="Show password" aria-pressed="false" title="Show password">
                                <svg class="password-eye-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <clipPath id="eye-clip-login">
                                            <path class="eye-aperture-path" d="M 2 12 C 5 6 19 6 22 12 C 19 18 5 18 2 12 Z" />
                                        </clipPath>
                                    </defs>
                                    <!-- Open eye clipped to opening eyelid aperture -->
                                    <g clip-path="url(#eye-clip-login)">
                                        <path class="eye-sclera" d="M 2 12 C 5 6 19 6 22 12 C 19 18 5 18 2 12 Z" />
                                        <g class="eye-pupil-group" style="transform: translate(0px, 0px);">
                                            <circle class="eye-iris" cx="12" cy="12" r="3.7" />
                                            <circle class="eye-pupil" cx="12" cy="12" r="2.1" />
                                            <circle class="eye-glint" cx="13.2" cy="10.8" r="0.9" />
                                        </g>
                                    </g>
                                    <!-- Open eye contour -->
                                    <path class="eye-open-outline" d="M 2 12 C 5 6 19 6 22 12 C 19 18 5 18 2 12 Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                                    <!-- Natural closed eyelid contour and lashes -->
                                    <g class="eye-closed-group">
                                        <path class="eye-closed-lid" d="M 3 12.5 C 7 16.5 17 16.5 21 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" />
                                        <path class="eye-closed-lash" d="M 6.8 14.5 L 5.5 16.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                        <path class="eye-closed-lash" d="M 12 15.6 L 12 18.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                        <path class="eye-closed-lash" d="M 17.2 14.5 L 18.5 16.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                    </g>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label small text-muted" for="remember-me">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        <i class="fas fa-sign-in-alt me-2"></i> Log In
                    </button>
                </form>

                <hr class="my-4">

                <!-- Quick Demo Login Helper -->
                <div class="small">
                    <span class="fw-semibold text-muted d-block mb-2 text-center">Quick Fill Demo Credentials:</span>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="fillCreds('student@smartcampus.com','Student@123')">Student</button>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="fillCreds('admin@smartcampus.com','Admin@123')">Admin</button>
                        <button type="button" class="btn btn-outline-info btn-sm" onclick="fillCreds('staff@smartcampus.com','Staff@123')">Staff</button>
                    </div>
                </div>

                <div class="text-center mt-4 pt-2 border-top">
                    <span class="small text-muted">Don't have an account? </span>
                    <a href="/register" class="small fw-bold text-primary text-decoration-none">Register as Student</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
        }

        // -------------------------------------------------------------------------
        // Interactive Animated Password Visibility Eye Toggle
        // -------------------------------------------------------------------------
        function setupAnimatedPasswordEye(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;

            const svg = btn.querySelector('.password-eye-svg');
            const pupilGroup = btn.querySelector('.eye-pupil-group');
            if (!svg || !pupilGroup) return;

            let isOpen = false;
            let targetX = 0;
            let targetY = 0;
            let currentX = 0;
            let currentY = 0;
            let rafId = null;

            const isTouch = () => window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
            const prefersReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function renderFrame() {
                if (!isOpen) {
                    pupilGroup.style.transform = 'translate(0px, 0px)';
                    rafId = null;
                    return;
                }

                currentX += (targetX - currentX) * 0.22;
                currentY += (targetY - currentY) * 0.22;

                pupilGroup.style.transform = `translate(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px)`;

                const remainingDist = Math.hypot(targetX - currentX, targetY - currentY);
                if (remainingDist > 0.02) {
                    rafId = requestAnimationFrame(renderFrame);
                } else {
                    currentX = targetX;
                    currentY = targetY;
                    pupilGroup.style.transform = `translate(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px)`;
                    rafId = null;
                }
            }

            function onPointerMove(e) {
                if (!isOpen || isTouch() || prefersReduced()) return;

                const rect = svg.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const dx = e.clientX - centerX;
                const dy = e.clientY - centerY;
                const dist = Math.hypot(dx, dy);

                if (dist < 2) {
                    targetX = 0;
                    targetY = 0;
                } else {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const factor = Math.min(dist / 240, 1);

                    targetX = nx * 3.5 * factor;
                    targetY = ny * 1.8 * factor;
                }

                if (!rafId) {
                    rafId = requestAnimationFrame(renderFrame);
                }
            }

            function startTracking() {
                if (isTouch() || prefersReduced()) return;
                btn.classList.add('is-tracking');
                window.addEventListener('pointermove', onPointerMove, { passive: true });
            }

            function stopTracking() {
                btn.classList.remove('is-tracking');
                window.removeEventListener('pointermove', onPointerMove);
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                targetX = 0;
                targetY = 0;
                currentX = 0;
                currentY = 0;
                pupilGroup.style.transform = 'translate(0px, 0px)';
            }

            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                const wasFocused = (document.activeElement === input);
                const selStart = input.selectionStart;
                const selEnd = input.selectionEnd;

                isOpen = !isOpen;

                input.type = isOpen ? 'text' : 'password';
                if (wasFocused) {
                    input.focus();
                    if (selStart !== null && selEnd !== null) {
                        input.setSelectionRange(selStart, selEnd);
                    }
                }

                btn.setAttribute('aria-label', isOpen ? 'Hide password' : 'Show password');
                btn.setAttribute('aria-pressed', isOpen ? 'true' : 'false');
                btn.setAttribute('title', isOpen ? 'Hide password' : 'Show password');

                if (isOpen) {
                    btn.classList.add('is-open');
                    startTracking();
                } else {
                    btn.classList.remove('is-open');
                    stopTracking();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupAnimatedPasswordEye('login-password-toggle', 'password');
        });
    </script>
</body>
</html>
