<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Smart Campus Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <div class="stat-icon-wrapper bg-primary text-white mx-auto mb-2" style="width:56px; height:56px;">
                    <i class="fas fa-tools fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-0">SmartCampus</h3>
                <small class="text-muted text-uppercase tracking-wider fw-semibold">Complaint &amp; Maintenance Portal</small>
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">
                <h5 class="fw-bold text-dark mb-3 text-center">Account Sign In</h5>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                    <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}">Success</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" required placeholder="name@smartcampus.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label small text-muted" for="remember-me">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        <i class="fas fa-sign-in-alt me-2"></i> Log In
                    </button>
                </form>

                <hr class="my-4">

                <!-- Quick Demo Login Helper -->
                <div class="small">
                    <span class="fw-semibold text-muted d-block mb-2 text-center">Quick Fill Demo Credentials:</span>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="fillCreds('student@smartcampus.com','Student@123')">Student</button>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="fillCreds('admin@smartcampus.com','Admin@123')">Admin</button>
                        <button type="button" class="btn btn-outline-info btn-sm" onclick="fillCreds('staff@smartcampus.com','Staff@123')">Staff</button>
                    </div>
                </div>

                <div class="text-center mt-4 pt-2 border-top">
                    <span class="small text-muted">Don't have an account? </span>
                    <a href="/register" class="small fw-bold text-primary text-decoration-none">Register as Student</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
        }
    </script>
</body>
</html>
