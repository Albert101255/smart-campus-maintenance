<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration — Smart Campus Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 540px;">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <h3 class="fw-bold text-dark mb-0"><i class="fas fa-user-graduate text-primary me-2"></i>Student Registration</h3>
                <small class="text-muted text-uppercase tracking-wider fw-semibold">Create your campus maintenance account</small>
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-sm-5">

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/register}" th:object="${registrationRequest}" method="post">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="name" class="form-label small fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Alex Morgan" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                        </div>

                        <div class="col-md-6">
                            <label for="registerNumber" class="form-label small fw-semibold">Register / Roll Number</label>
                            <input type="text" class="form-control" id="registerNumber" th:field="*{registerNumber}" placeholder="e.g. STU2026005" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('registerNumber')}" th:errors="*{registerNumber}"></small>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label small fw-semibold">Department</label>
                            <select class="form-select" id="department" th:field="*{department}" required>
                                <option value="" disabled selected>Select Department</option>
                                <option value="Computer Science &amp; Engineering">Computer Science &amp; Engineering</option>
                                <option value="Electronics &amp; Communication">Electronics &amp; Communication</option>
                                <option value="Electrical &amp; Electronics">Electrical &amp; Electronics</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Basic Sciences">Basic Sciences</option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></small>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="student@smartcampus.com" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                        </div>

                        <div class="col-md-6">
                            <label for="phoneNumber" class="form-label small fw-semibold">Phone Number</label>
                            <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" placeholder="+1 555-0199" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></small>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="At least 6 chars" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Repeat password" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mt-4">
                        <i class="fas fa-user-plus me-2"></i> Register Student Account
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <span class="small text-muted">Already registered? </span>
                    <a href="/login" class="small fw-bold text-primary text-decoration-none">Sign In Here</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
