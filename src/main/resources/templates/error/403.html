<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden — Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 text-center">
    <div class="container" style="max-width: 500px;">
        <div class="stat-icon-wrapper bg-danger-subtle text-danger mx-auto mb-3" style="width:80px; height:80px; font-size:2.5rem; border-radius:50%;">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark mb-2">403 Forbidden</h1>
        <p class="lead text-muted mb-4">Access Denied. You do not have permission to view or modify this campus resource.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary px-4 fw-semibold"><i class="fas fa-home me-1"></i> Return Home</a>
            <a href="/login" class="btn btn-outline-secondary px-4">Log In</a>
        </div>
    </div>
</body>
</html>
