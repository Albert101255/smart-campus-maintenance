<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light top-navbar">
    <div class="container-fluid">
        <button type="button" id="sidebarCollapse" class="btn btn-light me-3">
            <i class="fas fa-bars"></i>
        </button>

        <span class="fw-bold text-primary d-none d-sm-inline fs-5">
            <i class="fas fa-university me-2"></i>SMART CAMPUS
        </span>

        <div class="ms-auto d-flex align-items-center gap-3">
            <!-- Notification Bell -->
            <a href="/notifications" class="btn btn-outline-secondary btn-sm position-relative rounded-circle p-2">
                <i class="fas fa-bell"></i>
                <span th:if="${unreadCount != null and unreadCount > 0}"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      th:text="${unreadCount}">
                    0
                </span>
            </a>

            <!-- User Profile Dropdown -->
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 border rounded-pill px-3 py-1"
                        type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                         style="width: 32px; height: 32px; font-weight: 600;">
                        <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                    </div>
                    <span class="d-none d-md-inline fw-semibold small" sec:authentication="name">User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="userMenu">
                    <li><a class="dropdown-item py-2" href="/profile"><i class="fas fa-user-circle me-2 text-primary"></i>My Profile</a></li>
                    <li><a class="dropdown-item py-2" href="/notifications"><i class="fas fa-bell me-2 text-warning"></i>Notifications</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item py-2 text-danger"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
