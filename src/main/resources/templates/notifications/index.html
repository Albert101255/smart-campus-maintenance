<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications — Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('notifications')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Notifications Center</h3>
                    <p class="text-muted mb-0">System updates and complaint progress notifications.</p>
                </div>
                <form th:action="@{/notifications/read-all}" method="post">
                    <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="fas fa-check-double me-1"></i> Mark All as Read</button>
                </form>
            </div>

            <!-- List Card -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <div th:each="n : ${notifications.content}" class="list-group-item p-3" th:classappend="${!n.readStatus ? 'bg-light border-start border-4 border-primary' : ''}">
                            <div class="d-flex justify-content-between align-items-start gap-3">
                                <div>
                                    <h6 class="fw-bold mb-1 text-dark" th:text="${n.title}">Title</h6>
                                    <p class="mb-1 text-secondary" th:text="${n.message}">Message</p>
                                    <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}">Date</small>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <a th:if="${n.linkUrl != null}" th:href="${n.linkUrl}" class="btn btn-sm btn-outline-primary">View <i class="fas fa-arrow-right ms-1"></i></a>
                                    <form th:if="${!n.readStatus}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-light border"><i class="fas fa-check"></i></button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div th:if="${notifications.totalElements == 0}" class="text-center py-5 text-muted">
                            <i class="fas fa-bell-slash fs-2 mb-2 d-block text-secondary"></i>
                            No notifications yet.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
