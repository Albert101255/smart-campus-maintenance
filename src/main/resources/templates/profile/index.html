<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Profile — Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container" style="max-width: 900px; margin: 0 auto;">
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="mb-4">
                <h3 class="fw-bold mb-1">My Account Profile</h3>
                <p class="text-muted mb-0">Manage your profile details and security settings.</p>
            </div>

            <div class="row g-4">
                <!-- User Information & Edit Form -->
                <div class="col-md-7">
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-header bg-white py-3">
                            <h5 class="fw-bold mb-0 text-dark"><i class="fas fa-user-edit text-primary me-2"></i>Profile Information</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/profile/update}" th:object="${profileUpdateRequest}" method="post">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email Address (Username)</label>
                                    <input type="text" class="form-control bg-light" th:value="${user.email}" readonly>
                                    <div class="form-text">Primary identifier (cannot be changed).</div>
                                </div>

                                <div class="mb-3" th:if="${user.registerNumber != null}">
                                    <label class="form-label small fw-semibold">Register / Roll Number</label>
                                    <input type="text" class="form-control bg-light" th:value="${user.registerNumber}" readonly>
                                </div>

                                <div class="mb-3">
                                    <label for="name" class="form-label small fw-semibold">Full Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label small fw-semibold">Phone Number</label>
                                    <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}">
                                </div>

                                <div class="mb-3">
                                    <label for="department" class="form-label small fw-semibold">Department / Trade</label>
                                    <input type="text" class="form-control" id="department" th:field="*{department}">
                                </div>

                                <button type="submit" class="btn btn-primary fw-semibold px-4"><i class="fas fa-save me-1"></i> Update Profile</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Password Change Form -->
                <div class="col-md-5">
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-header bg-white py-3">
                            <h5 class="fw-bold mb-0 text-dark"><i class="fas fa-key text-warning me-2"></i>Change Password</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/profile/password}" th:object="${passwordChangeRequest}" method="post">
                                <div class="mb-3">
                                    <label for="currentPassword" class="form-label small fw-semibold">Current Password</label>
                                    <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="newPassword" class="form-label small fw-semibold">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label small fw-semibold">Confirm New Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required>
                                </div>
                                <button type="submit" class="btn btn-warning text-dark fw-semibold w-100"><i class="fas fa-lock me-1"></i> Update Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
