<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Completed Work History — Technician Workbench</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('completed')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Completed Work History</h3>
                    <p class="text-muted mb-0">Record of repairs successfully completed by you.</p>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Building &amp; Room</th>
                                    <th>Priority</th>
                                    <th>Completion Date</th>
                                    <th class="text-end">Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${complaints.content}">
                                    <td><strong class="text-primary" th:text="${c.complaintNumber}">CMP-2026-00001</strong></td>
                                    <td class="fw-semibold text-dark" th:text="${c.title}">Title</td>
                                    <td><span class="badge bg-light text-dark border" th:text="${c.category.name}">Category</span></td>
                                    <td th:text="${c.building.name + ' - Room ' + c.roomNumber}">Location</td>
                                    <td><span class="badge badge-custom" th:classappend="${c.priority.badgeClass}" th:text="${c.priority.displayName}">MEDIUM</span></td>
                                    <td class="small text-muted" th:text="${#temporals.format(c.resolvedAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                                    <td class="text-end">
                                        <a th:href="@{/staff/complaints/{id}(id=${c.id})}" class="btn btn-sm btn-light border"><i class="fas fa-eye me-1"></i>View</a>
                                    </td>
                                </tr>
                                <tr th:if="${complaints.totalElements == 0}">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        No completed work records found.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
