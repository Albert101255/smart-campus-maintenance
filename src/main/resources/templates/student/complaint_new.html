<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report New Issue — Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('new-complaint')}"></div>

    <div id="content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="page-container" style="max-width: 900px; margin: 0 auto;">
            <div class="mb-4">
                <a href="/student/complaints" class="text-decoration-none small text-muted"><i class="fas fa-arrow-left me-1"></i> Back to Complaints List</a>
                <h3 class="fw-bold mt-2">Report Campus Maintenance Problem</h3>
                <p class="text-muted">Please provide exact details so our maintenance team can inspect and fix the issue quickly.</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-sm-5">
                    <form th:action="@{/student/complaints/new}" th:object="${complaintCreateRequest}" method="post" enctype="multipart/form-data">
                        
                        <div class="mb-4">
                            <label for="title" class="form-label fw-semibold">Complaint Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" id="title" th:field="*{title}" placeholder="e.g. Projector not powering on in CSE Lab 2" required>
                            <div class="form-text">Brief, clear summary of the problem.</div>
                            <small class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="categoryId" class="form-label fw-semibold">Issue Category <span class="text-danger">*</span></label>
                                <select class="form-select" id="categoryId" th:field="*{categoryId}" required>
                                    <option value="" disabled selected>Select Problem Category</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Electrical</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="priority" class="form-label fw-semibold">Urgency Level <span class="text-danger">*</span></label>
                                <select class="form-select" id="priority" th:field="*{priority}" required>
                                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName + ' (' + p.urgencyText + ' — SLA ' + p.slaHours + 'h)'}">LOW</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="fw-bold border-bottom pb-2 mb-3 mt-4 text-dark"><i class="fas fa-map-marker-alt text-primary me-2"></i>Location Information</h5>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="buildingId" class="form-label fw-semibold">Building / Block <span class="text-danger">*</span></label>
                                <select class="form-select" id="buildingId" th:field="*{buildingId}" required>
                                    <option value="" disabled selected>Select Campus Building</option>
                                    <option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.name + (b.code != null ? ' (' + b.code + ')' : '')}">Main Block</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label for="floor" class="form-label fw-semibold">Floor Level <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="floor" th:field="*{floor}" placeholder="e.g. Ground / 2nd Floor" required>
                            </div>

                            <div class="col-md-3">
                                <label for="roomNumber" class="form-label fw-semibold">Room / Lab No <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="roomNumber" th:field="*{roomNumber}" placeholder="e.g. CSE-204" required>
                            </div>

                            <div class="col-12">
                                <label for="locationDescription" class="form-label fw-semibold">Specific Spot / Landmark</label>
                                <input type="text" class="form-control" id="locationDescription" th:field="*{locationDescription}" placeholder="e.g. Second computer near left window, or West corridor washroom">
                            </div>
                        </div>

                        <h5 class="fw-bold border-bottom pb-2 mb-3 mt-4 text-dark"><i class="fas fa-align-left text-primary me-2"></i>Detailed Description &amp; Photo</h5>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Description of Problem <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Describe what happens, symptoms, error messages, abnormal noises, leakages, etc." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="image" class="form-label fw-semibold">Upload Photo of Problem (Optional)</label>
                            <input class="form-control image-preview-input" type="file" id="image" th:field="*{image}" accept="image/png, image/jpeg, image/webp" data-preview-target="previewImg">
                            <div class="form-text">Accepted formats: JPG, PNG, WEBP. Max 10MB.</div>
                            <div class="mt-3">
                                <img id="previewImg" src="#" alt="Preview" class="img-thumbnail d-none" style="max-height: 200px;">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                            <a href="/student/complaints" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-5 fw-semibold shadow-sm">
                                <i class="fas fa-paper-plane me-2"></i> Submit Complaint
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
